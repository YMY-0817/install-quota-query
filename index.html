    </style>
    <!--
      启动看门狗（纯 ES5，兼容老浏览器）：
      若 4 秒后 #boot 仍在 DOM 里（说明 React 没挂载成功），就把兜底文案换成可直接反馈的诊断信息。
      作用是把"一直转圈"变成"能看懂、能截图报错"。
    -->
    <script>
      window.__qErr = [];
      window.addEventListener('error', function (e) {
        try {
          var f = (e.filename || '').split('/').pop();
          window.__qErr.push((e.message || '脚本错误') + (f ? ' @' + f + ':' + e.lineno : ''));
        } catch (_) {}
      });
      window.addEventListener('unhandledrejection', function (e) {
        try {
          window.__qErr.push('Promise: ' + ((e.reason && e.reason.message) || e.reason));
        } catch (_) {}
      });
      window.setTimeout(function () {
        var boot = document.getElementById('boot');
        if (!boot || boot.getAttribute('data-fail') === '1') return;
        var ua = navigator.userAgent;
        var old = /MSIE |Trident\//.test(ua);
        var msgs = window.__qErr.slice(0, 5);
        var hint = old
          ? '检测到 IE / 兼容模式：本页需要 Chrome、Edge 或 Firefox 等现代浏览器。'
          : msgs.length
            ? '脚本报错如下，请截图反馈。'
            : '脚本没有被执行（可能被安全软件、组策略或"禁用 JavaScript"拦截）。';
        boot.setAttribute('data-fail', '1');
        boot.className = 'fail';
        boot.innerHTML =
          '<b>查询器未能启动（4 秒未见响应）</b>' +
          '<p>' + hint + '</p>' +
          '<pre>浏览器：' + ua + '\n地址：' + location.href +
          '\n错误：' + (msgs.length ? '\n  - ' + msgs.join('\n  - ') : '无') + '</pre>';
      }, 4000);
    </script>
